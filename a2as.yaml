manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: matheuszy/agente-ia-criador-post
    source: https://github.com/matheuszy/agente-ia-criador-post
    branch: main
    commit: "d5e961ca"
    scope: [main.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:57:05Z'
    url: https://a2as.org/certified/agents/matheuszy/agente-ia-criador-post
  signatures:
    digest: sha256:FAH0MlMj9ogv7Oqtd_nW71lsksgQWYl9IbOKre3jfjg
    key: ed25519:QZJ86SMif24uUnVJVej8hXS8M6zczplAVrZEJoifn_c
    sig: ed25519:WDCJXUkpf-P-tbPQG6XBMn51P8W0Mnd-oFztZNb6G64bkDaAuu_zEFhhAT42Lh7BFDeezWHxx2gy7KKLx877DA

agents:
  buscador:
    type: instance
    models: [model]
    params:
      name: name
      description: description
      instruction: instruction
      function: criar_agente

models:
  model:
    type: literal
    agents: [buscador]

imports:
  Agent: google.adk.agents.Agent
  date: datetime.date
  google_search: google.adk.tools.google_search
  InMemorySessionService: google.adk.sessions.InMemorySessionService
  load_dotenv: dotenv.load_dotenv
  os: os
  Runner: google.adk.runners.Runner
  Session: google.adk.sessions.Session
  types: google.genai.types

functions:
  agente_buscador:
    type: sync
    module: main
    args: [topico, data_de_hoje]
  agente_planejador:
    type: sync
    module: main
    args: [topico, lancamentos_buscados]
  agente_redator:
    type: sync
    module: main
    args: [topico, plano_de_post]
  agente_revisor:
    type: sync
    module: main
    args: [topico, rascunho_gerado]
  call_agent:
    type: sync
    module: main
    args: [agent, message_text, user_id, session_id]
  criar_agente:
    type: sync
    module: main
    args: [name, model, description, instruction, tools]
  main:
    type: sync
    module: main

variables:
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [main]
